name: Build & Release

# dev -> daily pushes (no workflow run); PR dev -> main compiles the actual head SHA (required check "build").
# main/tag pushes reuse successful same-SHA unsigned artifacts, or compile once on a cache miss.
# main -> signed pre-release v<version>-pre when the fourth version part > 0; otherwise compile/skip only.
# tag v<version> -> signed full release (matching manifest, fourth version part = 0).
# Docs-only pushes/PRs skip the build (see job "changes").
on:
  push:
    branches: [main]
    tags: ['v*', '!v*-pre', '!v*-pre.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  # Serialize publishing refs so a release cannot race the remote version ceiling check.
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  NUGET_PACKAGES: ${{ github.workspace }}\.nuget-clean

jobs:
  # Docs-only changes (Markdown, docs/, assets/, issue/PR templates) skip the build.
  # A skipped "build" job still satisfies the required status check on main.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name != 'pull_request'
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!assets/**'
              - '!LICENSE'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/PULL_REQUEST_TEMPLATE.md'

  build:
    name: build
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      needs.changes.outputs.code == 'true'
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_SHA }}

      - name: Resolve release info
        id: info
        run: ./scripts/ci/Get-ReleaseInfo.ps1

      - name: Find a successful same-SHA compile artifact
        id: reuse
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ci/Find-CompileArtifact.ps1 -Publish:('${{ steps.info.outputs.publish }}' -eq 'true')

      - name: Download and verify reusable unsigned bytes
        id: restore
        if: steps.reuse.outputs.plan == 'reuse'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          ./scripts/ci/Receive-CompileArtifact.ps1
          -ArtifactId '${{ steps.reuse.outputs.artifact_id }}'
          -ArchiveSha256 '${{ steps.reuse.outputs.archive_sha256 }}'
          -Version '${{ steps.info.outputs.version }}'

      - name: Resolve compilation fallback
        id: mode
        env:
          REUSE_PLAN: ${{ steps.reuse.outputs.plan }}
          ARTIFACT_RESTORED: ${{ steps.restore.outputs.reused }}
        run: |
          . ./scripts/ci/CompileArtifact.ps1
          $compile = Test-CiCompilationNeeded -Plan $env:REUSE_PLAN -Restored ($env:ARTIFACT_RESTORED -eq 'true')
          Set-CiOutput 'compile' $compile.ToString().ToLowerInvariant()

      - name: Setup .NET (global.json)
        if: steps.mode.outputs.compile == 'true'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore native assets cache
        if: steps.mode.outputs.compile == 'true'
        uses: actions/cache@v6
        with:
          path: |
            src/Desktop/BiliCopilot.UI/Assets/libmpv/x64/libmpv-2.dll
          key: native-${{ hashFiles('scripts/ci/Provision-NativeAssets.ps1', 'scripts/native-assets.json') }}

      - name: Provision native assets (libmpv, Visor)
        if: steps.mode.outputs.compile == 'true'
        run: ./scripts/ci/Provision-NativeAssets.ps1

      - name: Test offline installer
        if: steps.mode.outputs.compile == 'true'
        shell: powershell
        run: ./scripts/local-release/tests/Test-Installer.ps1 -SourceRoot scripts/local-release -WorkRoot artifacts/installer-tests

      - name: Compile unsigned MSIX and stage pinned offline frameworks
        if: steps.mode.outputs.compile == 'true'
        run: ./scripts/Build-Release.ps1

      - name: Stage reusable unsigned compile artifact
        id: compiled
        if: steps.mode.outputs.compile == 'true'
        run: >-
          ./scripts/ci/New-CompileArtifact.ps1
          -Version '${{ steps.info.outputs.version }}'
          -SourceSha $env:SOURCE_SHA
          -SourceRepository $env:SOURCE_REPOSITORY

      - name: Upload reusable compile artifact (no signing keys)
        if: steps.mode.outputs.compile == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.compiled.outputs.artifact_name }}
          path: artifacts/compiled/
          if-no-files-found: error
          retention-days: 14

      - name: Import release signing certificate
        id: cert
        if: steps.info.outputs.publish == 'true'
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
          SIGNING_CERT_THUMBPRINT: ${{ secrets.SIGNING_CERT_THUMBPRINT }}
        run: ./scripts/ci/Import-SigningCertificate.ps1

      - name: Sign and verify release MSIX (fresh or reused)
        if: steps.info.outputs.publish == 'true'
        run: >-
          ./scripts/ci/Complete-ReleasePackage.ps1
          -Version '${{ steps.info.outputs.version }}'
          -CertificateThumbprint '${{ steps.cert.outputs.thumbprint }}'

      - name: Package delivery ZIP (with one-click installer)
        id: delivery
        if: steps.info.outputs.publish == 'true'
        run: |
          ./scripts/local-release/Make-Delivery.ps1 -CertificateThumbprint '${{ steps.cert.outputs.thumbprint }}'
          $zip = @(Get-ChildItem artifacts/release -Filter 'BiliFluent-*.zip' -File)
          if ($zip.Count -ne 1) { throw "Expected exactly one delivery ZIP, found $($zip.Count)" }
          $dir = $zip[0].FullName -replace '\.zip$', ''
          $cer = Join-Path $dir 'payload/BiliFluent.cer'
          if (-not (Test-Path -LiteralPath $cer)) { throw "Certificate not found in delivery: $cer" }
          $sha = (Get-FileHash -LiteralPath (Join-Path $dir 'release-artifacts.json') -Algorithm SHA256).Hash.ToLowerInvariant()
          "zip=$($zip[0].FullName)" >> $env:GITHUB_OUTPUT
          "zipname=$($zip[0].BaseName)" >> $env:GITHUB_OUTPUT
          "cer=$cer" >> $env:GITHUB_OUTPUT
          "manifest_sha256=$sha" >> $env:GITHUB_OUTPUT
          Write-Host "Delivery ZIP: $($zip[0].FullName) (manifest SHA-256 $sha)"

      - name: Upload delivery ZIP
        if: steps.info.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.delivery.outputs.zipname }}-${{ steps.info.outputs.tag }}
          path: ${{ steps.delivery.outputs.zip }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        if: steps.info.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $publishArgs = @{
            Tag            = '${{ steps.info.outputs.tag }}'
            Title          = '${{ steps.info.outputs.title }}'
            Version        = '${{ steps.info.outputs.version }}'
            Assets         = @('${{ steps.delivery.outputs.zip }}', '${{ steps.delivery.outputs.cer }}')
            ManifestSha256 = '${{ steps.delivery.outputs.manifest_sha256 }}'
            Prerelease     = ('${{ steps.info.outputs.prerelease }}' -eq 'true')
          }
          ./scripts/ci/Publish-GitHubRelease.ps1 @publishArgs

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-${{ github.run_number }}
          path: |
            artifacts/release/*.log
            artifacts/release/*.binlog
            artifacts/release/*.command.json
          if-no-files-found: ignore
          retention-days: 14
